[project]
name = "botloggi"
dynamic = ["version"]
description = "botloggi CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
botloggi = "botloggi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botloggi"]

[tool.hatch.version]
path = "src/botloggi/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
